<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100" font-family="Verdana, sans-serif">
  <rect width="850" height="1100" fill="#ffffff"/>

  <text x="425" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#1C3A6E">MathCrown — Champion Medal</text>
  <text x="425" y="80" text-anchor="middle" font-size="16" fill="#555">Print on card stock, cut the solid lines, punch the two dots, and thread a ribbon or string through.</text>

  <!-- Ribbon -->
  <g transform="translate(325,120)">
    <polygon points="0,0 200,0 200,220 100,170 0,220" fill="#FF6B6B" stroke="#111" stroke-width="3"/>
    <polygon points="0,0 200,0 200,220 100,170 0,220" fill="none" stroke="#111" stroke-width="3"/>
    <line x1="60" y1="30" x2="60" y2="220" stroke="#fff" stroke-width="10" opacity="0.5"/>
    <line x1="140" y1="30" x2="140" y2="220" stroke="#fff" stroke-width="10" opacity="0.5"/>
  </g>

  <!-- Punch holes -->
  <circle cx="385" cy="150" r="6" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="2,2"/>
  <circle cx="465" cy="150" r="6" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="425" y="175" text-anchor="middle" font-size="11" fill="#555">punch here</text>

  <!-- Medal disc -->
  <g transform="translate(425,560)">
    <circle r="180" fill="#FFD93D" stroke="#111" stroke-width="4"/>
    <circle r="150" fill="none" stroke="#E8B800" stroke-width="6" stroke-dasharray="10,6"/>
    <text y="-30" text-anchor="middle" font-size="70" font-weight="bold" fill="#1C3A6E">🏆</text>
    <text y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1C3A6E">CHAMPION</text>
    <text y="75" text-anchor="middle" font-size="16" fill="#5A3E00">MathCrown</text>
  </g>

  <!-- Blank line for the student's name -->
  <g transform="translate(225,800)">
    <text x="200" y="0" text-anchor="middle" font-size="14" fill="#555">Write your name on the line below and show it off!</text>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#111" stroke-width="2"/>
  </g>

  <text x="425" y="920" text-anchor="middle" font-size="14" fill="#555">1. Cut around the ribbon and the medal circle.</text>
  <text x="425" y="945" text-anchor="middle" font-size="14" fill="#555">2. Punch the two dots and thread a ribbon or piece of string through to wear it.</text>
  <text x="425" y="970" text-anchor="middle" font-size="14" fill="#555">3. Write your name on the line and wear it with pride!</text>
  <text x="425" y="1010" text-anchor="middle" font-size="16" font-weight="bold" fill="#1C3A6E">🏆 You earned it, Champion! 🏆</text>
</svg>
